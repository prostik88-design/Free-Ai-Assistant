name: Build Android APK

on:
  workflow_dispatch: # Этот параметр открывает кнопку ручного запуска в интерфейсе

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
        
      - name: Build Release APK
        run: ./gradlew assembleRelease # Команда для сборки релизного APK
        
