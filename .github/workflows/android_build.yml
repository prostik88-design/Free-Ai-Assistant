name: Build Android APK

# Скрипт запускается при пуше в ветку main или при ручном вызове
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Клонируем репозиторий на виртуальную машину
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем необходимую версию Java (для вашего проекта нужен JDK 17)
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    # 3. Даем права на исполнение скрипту Gradle Wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Запускаем сборку отладочного APK (Debug APK)
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 5. Сохраняем готовый APK-файл в артефакты GitHub
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
